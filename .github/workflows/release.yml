name: Release

# Tag vX.Y.Z (matching package.json) on main to package the extension, attach
# the .vsix to a GitHub release and publish it. Each store is skipped when its
# secret is missing:
#   VSCE_PAT - Visual Studio Marketplace (publisher `brokspace`)
#   OVSX_PAT - Open VSX (namespace `brokspace`), used by Cursor, Windsurf and VSCodium

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          [ "v$version" = "$TAG" ] || { echo "::error::tag $TAG does not match package.json $version"; exit 1; }
      - run: npm run lint && npm run typecheck && npm run l10n:check
      - run: npm run package
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes --title "Brokspace for VS Code $TAG"
          gh release upload "$TAG" ./*.vsix --clobber
      - name: Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then echo "::notice::VSCE_PAT not set; skipping the Marketplace"; exit 0; fi
          npx vsce publish --packagePath ./*.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then echo "::notice::OVSX_PAT not set; skipping Open VSX"; exit 0; fi
          npx --yes ovsx publish ./*.vsix --pat "$OVSX_PAT"
